<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiDAR-Controlled Robot UI</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <header>
        <h1>LiDAR Autonomous Mobile Robot</h1>
    </header>
    <main>
        <section id="lidar-container">
            <h2>LiDAR Map</h2>
            <div id="lidar-map" style="width: 600px; height: 400px; border: 1px solid #ccc; background: #f0f0f0; display: flex; align-items: center; justify-content: center;">
                <p>LiDAR Visualization Placeholder</p>
            </div>
        </section>
        <section id="controls">
            <h2>Controls</h2>
            <button id="start-btn">Start</button>
            <button id="stop-btn">Stop</button>
        </section>
    </main>
    <script src="src/app.js"></script>
</body>
</html>
