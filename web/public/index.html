<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiDAR Autonomous Robot - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/roslib.min.js"></script>
</head>
<body>

<header>
    <h1>🤖 LiDAR Autonomous Robot — Web UI</h1>
    <div class="header-right">
        <button id="mock-btn" class="btn-mock" onclick="toggleMockMode()">🧪 Design / Mock Mód</button>
        <div id="conn-status" class="status-badge">⏳ Csatlakozás...</div>
    </div>
</header>

<main>
    <div id="canvas-container">
        <canvas id="lidarCanvas" width="750" height="750"></canvas>
    </div>

    <aside class="sidebar">
        <div class="card">
            <h3>📡 LiDAR (/scan) Telemetria</h3>
            <p>Pontok száma: <span id="point-count" class="stat-value">0</span></p>
            <p style="margin-top:6px;">Legközelebbi tárgy: <span id="min-dist" class="stat-value">-</span> m</p>
        </div>

        <div class="card">
            <h3>🔍 Radar Nézet (Zoom)</h3>
            <p>Skála: <span id="scale-val">80</span> px / méter</p>
            <div class="controls">
                <button onclick="changeZoom(15)">+ Közelítés</button>
                <button onclick="changeZoom(-15)">- Távolítás</button>
            </div>
        </div>

        <div class="card">
            <h3>🏠 Navigáció (Hamarosan)</h3>
            <div class="controls">
                <button onclick="alert('Go Home parancs küldése...')">🏠 Bázispont (Go Home)</button>
            </div>
        </div>
    </aside>
</main>

<script src="js/app.js"></script>
</body>
</html>
